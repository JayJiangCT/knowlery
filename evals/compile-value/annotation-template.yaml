# Compile-value annotation sheet — protocol cv-eval@1
# (docs/design/compile-value/evaluation-protocol.md)
#
# This committed file is the TEMPLATE, with one synthetic example. Real sheets are
# generated by evals/compile-value/sample.ts into a directory OUTSIDE the repository
# and never committed: the repository is public.
#
# Rules for the annotator:
#   - Do not look at Jev scores, signal values, orderings, or the stratum of any note.
#   - Judge against the FROZEN knowledge base (the freeze copy), not the live vault.
#   - Read each note in full. Open compiled pages as needed to judge delta.
#   - Leave a field as ~ (null) only where the field says it is optional.

header:
  protocol: cv-eval@1
  freeze_id: "<sha256 of the freeze manifest — filled by sample.ts>"
  frozen_at: "<ISO timestamp of T0 — filled by sample.ts>"
  focus_sources:              # what "relevance" is judged against, in precedence order
    - .knowlery/focus.md      # omitted by sample.ts when absent at T0
    - KNOWLEDGE.md
  annotator: "<name or initials>"
  pass: first                 # first | second-annotator | intra-rater
  sheet_seed: 0               # shuffle seed — filled by sample.ts
  assumed_session_size: "10-20 notes"

notes:
  # One entry per sampled note, in sheet order. sample.ts pre-fills `id`, `path`,
  # and `seeded_critical`; everything else is the annotator's.
  - id: n001
    path: Projects/example-service/2026-03-04 storage decision.md
    seeded_critical: false    # true for notes nominated before sampling (reported separately)

    # 5.1 Knowledge Worth — yes | no | unsure
    worth: yes

    # 5.2 Knowledge Delta vs the frozen compiled pages — new | partial | redundant | unknown | n/a
    #     (n/a only when worth is no)
    delta: partial
    delta_evidence:
      pages:                  # compiled pages that already hold some of the content
        - concepts/example-service-storage.md
      how_checked: "Searched 'example-service storage'; read the concept page; the retention numbers in the note are not on it."

    # 5.3 User Relevance vs the frozen focus — high | medium | low | unknown
    relevance: high

    # 5.4 PRIMARY TARGET: if the next /cook could process only 10-20 notes, is this one of them?
    cook_next: yes

    # 5.5 type — decision | requirement | ticket | meeting | journal | reference |
    #            draft | template | generated | other
    type: decision

    # 5.6 importance — critical | normal
    importance: critical

    # 5.7 optional
    target: concepts/example-service-storage.md   # compiled page path, or "new", or ~
    minutes_spent: 3                               # optional, helps plan the next round
    notes: ~
