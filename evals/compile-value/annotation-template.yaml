# Compile-value annotation sheet — protocol cv-eval@1, revision 2
# (docs/design/compile-value/evaluation-protocol.md)
#
# This committed file is the TEMPLATE, with synthetic examples only. Real sheets are
# generated by evals/compile-value/sample.ts and pool.ts into a directory OUTSIDE the
# repository and never committed: the repository is public.
#
# Rules for the annotator:
#   - Do not look at Jev scores, signal values, orderings, or the private harness file.
#     The sheet deliberately carries no tier, stratum, inclusion probability or
#     "seeded" flag; those live only in the private file.
#   - Judge against the FROZEN knowledge base (the freeze copy), not the live vault,
#     and against the focus in force at frozen_at in frozen_tz.
#   - Read each note in full. Open compiled pages as needed to judge delta.
#     `redundant` needs the compiled page's CONTENT checked, not a similar raw note.
#   - Step 1: label every note (section `notes`). Step 2: only after all notes are
#     labelled, fill `selected_next` (section 6.4.2 of the protocol).
#   - Leave a field as ~ (null) only where the field says it is optional.

header:
  protocol: cv-eval@1
  protocol_revision: 2
  freeze_id: "<sha256 of the freeze manifest — filled by sample.ts>"
  frozen_at: "<ISO timestamp of T0, UTC — filled by sample.ts>"
  frozen_tz: "<IANA time zone of the freezing machine, e.g. Asia/Shanghai — filled by sample.ts>"
  focus_sources:              # what "relevance" is judged against, in precedence order
    - .knowlery/focus.md      # omitted by sample.ts when absent or expired at frozen_at
    - KNOWLEDGE.md
  session_size: 10            # the next /cook session processes at most this many notes
  annotator: "<name or initials>"
  pass: first                 # first | intra-rater | second-annotator (qualified only)
  sheet_seed: 0               # shuffle seed — filled by sample.ts

notes:
  # One entry per note, in sheet order. sample.ts / pool.ts pre-fill `id` and `path`;
  # everything else is the annotator's.
  - id: n001
    path: Projects/example-service/2026-03-04 storage decision.md

    # 6.1 Knowledge Worth — yes | no | unsure
    worth: yes

    # 6.2 Knowledge Delta vs the frozen compiled pages — new | partial | redundant | unknown | n/a
    #     (n/a only when worth is no; redundant only after checking page content)
    delta: partial
    delta_evidence:
      pages:                  # compiled pages checked or found to hold some of the content
        - concepts/example-service-storage.md
      how_checked: "Searched 'example-service storage'; read the concept page; the retention numbers in the note are not on it."

    # 6.3 User Relevance vs the frozen focus — high | medium | low | unknown
    relevance: high

    # 6.4.1 PRIMARY TARGET — in the priority candidate set for a <= 10-note session?
    #   yes only if ALL hold: (1) uncompiled durable content; (2) useful now, not blocked;
    #   (3) not better handled inside another note's compilation (then list it in that
    #   note's compile_with and give only the lead note yes); (4) a reason code applies.
    cook_next: yes
    cook_next_reason:         # required when cook_next is yes, else ~
      code: updates-page      # new-decision | updates-page | focus-gap | unblocks | time-sensitive | other
      why: "The storage concept page still lists the old 30-day retention; this note records the change to 90 days."
    depends_on: []            # notes or compiled pages that must be compiled first (paths)
    compile_with:             # notes to compile together with this one (paths)
      - Projects/example-service/2026-03-05 retention follow-up.md

    # 6.5 type — decision | requirement | ticket | meeting | journal | reference |
    #            draft | template | generated | other
    type: decision

    # 6.6 importance — critical | normal (about the knowledge, compiled or not)
    importance: critical
    # actionable_critical — yes | no | ~
    #   Derived as critical AND delta in {new, partial}. Fill it explicitly ONLY when
    #   importance is critical and delta is unknown; otherwise leave ~ and the harness
    #   derives it. critical + redundant is never actionable.
    actionable_critical: ~

    # 6.7 optional
    target: concepts/example-service-storage.md   # compiled page path, or "new", or ~
    minutes_spent: 3
    notes: ~

  - id: n002
    path: Projects/example-service/2026-03-05 retention follow-up.md
    worth: yes
    delta: new
    delta_evidence:
      pages: []
      how_checked: "Searched 'retention job' and 'example-service retention'; no compiled page mentions the cleanup job."
    relevance: high
    cook_next: no             # compiled together with n001 (listed in its compile_with)
    cook_next_reason: ~
    depends_on: []
    compile_with: []
    type: meeting
    importance: normal
    actionable_critical: ~
    target: concepts/example-service-storage.md
    minutes_spent: 2
    notes: ~

# 6.4.2 Budgeted selection — operational tier only, filled AFTER every note above is
# labelled. At most session_size entries, in priority order, chosen from notes with
# cook_next: yes. Leave as [] for a diagnostic-only round.
selected_next:
  - n001
